# Render Blueprint for the API. In Render: New -> Blueprint -> pick this repo.
# The web app is deployed to Vercel (see README). Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    # If this folder is not the repository root, set rootDir to its path (e.g. portfolio).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @portfolio/api build && pnpm --filter @portfolio/api db:deploy
    startCommand: pnpm --filter @portfolio/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Vercel rewrite -> Render = 2 proxies in front of the API (needed for correct client IPs / rate limits).
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL        # Neon: use the DIRECT (non-pooled) connection string
        sync: false
      - key: JWT_ACCESS_SECRET   # openssl rand -base64 48
        generateValue: true
      - key: JWT_REFRESH_SECRET  # openssl rand -base64 48
        generateValue: true
      - key: REVALIDATE_SECRET   # must equal REVALIDATE_SECRET in the Vercel project
        sync: false
      - key: WEB_ORIGIN          # e.g. https://yourname.dev (no trailing slash)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_PORT
        value: "587"
      # Optional, add later in the Render dashboard (Environment) when you want them:
      #   GITHUB_TOKEN  - enables the GitHub contribution graph
      #   RESEND_API_KEY (+ MAIL_FROM) - emails you when the contact form is used (use this on Render: SMTP is blocked on the free plan)
      #   or SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM on hosts that allow SMTP
